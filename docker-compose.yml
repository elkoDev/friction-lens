services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: frictionlens
      POSTGRES_USER: frictionlens
      POSTGRES_PASSWORD: frictionlens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  pgdata:
  ollama_models:
