name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Restore & Build (.NET 11)
        run: dotnet build backend/FrictionLens.slnx -c Release
      - name: Run Unit, Integration & Golden Eval Gate
        run: dotnet test backend/FrictionLens.slnx -c Release --no-build --logger "console;verbosity=normal"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm --prefix frontend ci
      - name: Lint & Typecheck & Build
        run: npm --prefix frontend run lint && npm --prefix frontend run build
